name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Compile Debug & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK licenses & Install SDK 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" > /dev/null || true

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare .env and local.properties for Secrets Plugin
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi
          if [ -n "$GEMINI_API_KEY" ]; then
            echo "" >> .env
            echo "GEMINI_API_KEY=$GEMINI_API_KEY" >> .env
          else
            echo "GEMINI_API_KEY=dummy_key" >> .env
          fi
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "GEMINI_API_KEY=${GEMINI_API_KEY:-dummy_key}" >> local.properties
          cp .env secrets.properties || true

      - name: Prepare google-services.json if missing
        run: |
          if [ ! -f app/google-services.json ]; then
            cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "123456789012",
              "project_id": "nexus-tunnel-mock",
              "storage_bucket": "nexus-tunnel-mock.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789012:android:1234567890abcdef",
                  "android_client_info": {
                    "package_name": "com.aistudio.nexustunnel.vprqza"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyDummyKeyForCIBuildOnly123456789"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

      - name: Fix compileSdk minorApiLevel for CI compatibility
        run: |
          sed -i 's/compileSdk { version = release(36) { minorApiLevel = 1 } }/compileSdk = 36/g' app/build.gradle.kts

      - name: Setup Signing Environment Variables
        run: |
          STORE_PASS="${{ secrets.STORE_PASSWORD }}"
          if [ -z "$STORE_PASS" ]; then
            STORE_PASS="android"
          fi
          KEY_PASS="${{ secrets.KEY_PASSWORD }}"
          if [ -z "$KEY_PASS" ]; then
            KEY_PASS="android"
          fi
          echo "STORE_PASSWORD=$STORE_PASS" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"
          echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/my-upload-key.jks" >> "$GITHUB_ENV"

      - name: Prepare debug.keystore & my-upload-key.jks
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -v \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

          if [ ! -f my-upload-key.jks ]; then
            keytool -genkeypair -v \
              -keystore my-upload-key.jks \
              -storepass "$STORE_PASSWORD" \
              -alias upload \
              -keypass "$KEY_PASSWORD" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=NexusTunnel,O=AIStudio,C=US"
          fi

      - name: Prepare mock libv2ray.aar and Kotlin stubs for CI
        run: |
          mkdir -p app/libs
          echo '<manifest package="com.example.libv2ray"></manifest>' > AndroidManifest.xml
          zip app/libs/libv2ray.aar AndroidManifest.xml
          rm AndroidManifest.xml
          mkdir -p app/src/main/java/go
          cat << 'STUB_EOF' > app/src/main/java/go/Seq.kt
          package go
          import android.content.Context
          object Seq {
              @JvmStatic fun setContext(context: Context) {}
          }
          STUB_EOF
          mkdir -p app/src/main/java/libv2ray
          cat << 'STUB_EOF' > app/src/main/java/libv2ray/Libv2ray.kt
          package libv2ray
          interface CoreCallbackHandler {
              fun startup(): Long
              fun shutdown(): Long
              fun onEmitStatus(p0: Long, msg: String?): Long
          }
          interface CoreController {
              val isRunning: Boolean
              fun startLoop(configJson: String, tunFd: Int): Long
              fun stopLoop(): Long
              fun queryAllOutboundTrafficStats(): String?
          }
          object Libv2ray {
              @JvmStatic fun initCoreEnv(assetDir: String, key: String) {}
              @JvmStatic fun checkVersionX(): String { return "1.0" }
              @JvmStatic fun newCoreController(handler: CoreCallbackHandler): CoreController {
                  return object : CoreController {
                      override val isRunning: Boolean = true
                      override fun startLoop(configJson: String, tunFd: Int): Long { return 0 }
                      override fun stopLoop(): Long { return 0 }
                      override fun queryAllOutboundTrafficStats(): String? { return null }
                  }
              }
          }
          STUB_EOF

      - name: Build Debug APK
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew :app:assembleDebug --no-daemon --stacktrace
          else
            gradle :app:assembleDebug --no-daemon --stacktrace
          fi

      - name: Build Release APK
        run: |
          if [ -f ./gradlew ]; then
            ./gradlew :app:assembleRelease --no-daemon --stacktrace
          else
            gradle :app:assembleRelease --no-daemon --stacktrace
          fi

      - name: Upload Debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk
          
