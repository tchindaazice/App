name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Compile Debug & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK licenses & Install SDK 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" > /dev/null || true

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare .env and local.properties for Secrets Plugin
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi
          if [ -n "$GEMINI_API_KEY" ]; then
            echo "" >> .env
            echo "GEMINI_API_KEY=$GEMINI_API_KEY" >> .env
          else
            echo "GEMINI_API_KEY=dummy_key" >> .env
          fi
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "GEMINI_API_KEY=${GEMINI_API_KEY:-dummy_key}" >> local.properties
          cp .env secrets.properties || true

      - name: Prepare google-services.json if missing
        run: |
          if [ ! -f app/google-services.json ]; then
            cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "123456789012",
              "project_id": "nexus-tunnel-mock",
              "storage_bucket": "nexus-tunnel-mock.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789012:android:1234567890abcdef",
                  "android_client_info": {
                    "package_name": "com.aistudio.nexustunnel.vprqza"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyDummyKeyForCIBuildOnly123456789"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

      - name: Fix compileSdk minorApiLevel for CI compatibility
        run: |
          sed -i 's/compileSdk { version = release(36) { minorApiLevel = 1 } }/compileSdk = 36/g' app/build.gradle.kts

      - name: Setup Signing Environment Variables
        run: |
          STORE_PASS="${{ secrets.STORE_PASSWORD }}"
          if [ -z "$STORE_PASS" ]; then
            STORE_PASS="android"
          fi
          KEY_PASS="${{ secrets.KEY_PASSWORD }}"
          if [ -z "$KEY_PASS" ]; then
            KEY_PASS="android"
          fi
          echo "STORE_PASSWORD=$STORE_PASS" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"
          echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/my-upload-key.jks" >> "$GITHUB_ENV"

      - name: Prepare debug.keystore & my-upload-key.jks
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -v \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

          if [ ! -f my-upload-key.jks ]; then
            keytool -genkeypair -v \
              -keystore my-upload-key.jks \
              -storepass "$STORE_PASSWORD" \
              -alias upload \
              -keypass "$KEY_PASSWORD" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=NexusTunnel,O=AIStudio,C=US"
          fi

      - name: Generate mock libv2ray.aar
        run: |
          mkdir -p /tmp/mock_aar/classes/go
          mkdir -p /tmp/mock_aar/classes/libv2ray
          cat << 'JAVA' > /tmp/mock_aar/classes/go/Seq.java
          package go;
          public class Seq {
              public static void setContext(android.content.Context context) {}
          }
          JAVA
          cat << 'JAVA' > /tmp/mock_aar/classes/libv2ray/Libv2ray.java
          package libv2ray;
          public class Libv2ray {
              public static void initV2Env(String config, String cache) {}
              public static void initCoreEnv(String config, String cache) {}
              public static String checkVersionX() { return ""; }
              public static void registerCoreCallbackHandler(CoreCallbackHandler handler) {}
              public static CoreController newCoreController(CoreCallbackHandler handler) { return null; }
              public static String queryAllOutboundTrafficStats() { return ""; }
              public static void stopLoop() {}
          }
          JAVA
          cat << 'JAVA' > /tmp/mock_aar/classes/libv2ray/CoreController.java
          package libv2ray;
          public interface CoreController {
              void startLoop(String json, int fd);
          }
          JAVA
          cat << 'JAVA' > /tmp/mock_aar/classes/libv2ray/CoreCallbackHandler.java
          package libv2ray;
          public interface CoreCallbackHandler {
              long startup();
              long shutdown();
              long onEmitStatus(long p0, String msg);
          }
          JAVA
          cd /tmp/mock_aar/classes
          javac -target 11 -source 11 -cp $ANDROID_HOME/platforms/android-36/android.jar go/Seq.java libv2ray/Libv2ray.java libv2ray/CoreController.java libv2ray/CoreCallbackHandler.java
          jar cf ../classes.jar .
          cd ..
          mkdir -p res
          cat << 'XML' > AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest package="com.example.libv2ray"></manifest>
          XML
          mkdir -p ${GITHUB_WORKSPACE}/app/libs
          zip -r ${GITHUB_WORKSPACE}/app/libs/libv2ray.aar classes.jar AndroidManifest.xml res

      - name: Build Debug APK
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew :app:assembleDebug --no-daemon --stacktrace
          else
            gradle :app:assembleDebug --no-daemon --stacktrace
          fi

      - name: Build Release APK
        run: |
          if [ -f ./gradlew ]; then
            ./gradlew :app:assembleRelease --no-daemon --stacktrace
          else
            gradle :app:assembleRelease --no-daemon --stacktrace
          fi

      - name: Upload Debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk
          
