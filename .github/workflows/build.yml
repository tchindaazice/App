name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Compile Debug & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (required for AGP 9.1.1 & Gradle 9.3.1)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare .env file for Secrets Gradle Plugin
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi
          if [ -n "$GEMINI_API_KEY" ]; then
            echo "" >> .env
            echo "GEMINI_API_KEY=$GEMINI_API_KEY" >> .env
          fi

      - name: Setup Signing Environment Variables
        run: |
          STORE_PASS="${{ secrets.STORE_PASSWORD }}"
          if [ -z "$STORE_PASS" ]; then
            STORE_PASS="android"
          fi
          KEY_PASS="${{ secrets.KEY_PASSWORD }}"
          if [ -z "$KEY_PASS" ]; then
            KEY_PASS="android"
          fi
          echo "STORE_PASSWORD=$STORE_PASS" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"
          echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/my-upload-key.jks" >> "$GITHUB_ENV"

      - name: Prepare debug.keystore & my-upload-key.jks
        run: |
          # 1. Prepare debug.keystore
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              echo "Decoding debug.keystore from base64..."
              base64 -d debug.keystore.base64 > debug.keystore
            else
              echo "Generating debug.keystore..."
              keytool -genkeypair -v \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

          # 2. Prepare my-upload-key.jks for release signing
          if [ ! -f my-upload-key.jks ]; then
            echo "Generating release keystore my-upload-key.jks..."
            keytool -genkeypair -v \
              -keystore my-upload-key.jks \
              -storepass "$STORE_PASSWORD" \
              -alias upload \
              -keypass "$KEY_PASSWORD" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=NexusTunnel,O=AIStudio,C=US"
          fi

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Build Release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Upload Debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk
